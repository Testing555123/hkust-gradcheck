name: CI

# 部署由 Cloudflare Pages 的 Git 集成负责（push 即构建上线），
# 这里只做质量门禁：类型/规范、单测、构建，以及「静态数据与管线产物是否一致」。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验已提交的数据产物（数量断言）
        run: python scripts/export_static_data.py --check

      - name: 校验数据产物与 pipeline/output 一致
        run: |
          python scripts/export_static_data.py
          if ! git diff --quiet -- \
            frontend/public/data/index.json \
            frontend/public/data/courses.json \
            frontend/public/data/course_index.json \
            frontend/public/data/programs; then
            echo "::error::pipeline/output 已更新，但 frontend/public/data 未同步。请在本机运行 scripts/export_static_data.py 后提交产物。"
            git diff --stat -- frontend/public/data
            exit 1
          fi
