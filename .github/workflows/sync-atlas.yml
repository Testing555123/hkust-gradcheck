name: Sync static data to MongoDB Atlas

# 職責邊界：這個工作流只把「已導出的靜態產物」同步到 Atlas（秒級、零 API 成本）。
# PDF 抽取（MinerU + LLM，有真實費用）仍在本機手動執行，
# 產物提交後由本工作流或手動觸發同步。
on:
  schedule:
    # 每週一 01:00 UTC（台北時間 09:00）：產物若無變動，upsert 也是空操作
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      prune:
        description: 刪除資料庫中已下線的方案與課程
        type: boolean
        default: false
  # 產物有變動時自動同步（只監看資料，改程式碼不觸發）
  push:
    branches: [main]
    paths:
      - "frontend/public/data/**"
      - "scripts/sync_to_atlas.py"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝同步依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sync.txt

      - name: 校驗產物（與 CI 相同的數量斷言）
        # 產物不自洽時直接失敗，絕不把壞資料寫進資料庫
        run: python scripts/export_static_data.py --check

      - name: 檢查是否已設定 Atlas 連線
        id: gate
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚未設定 MONGODB_URI secret，已略過同步（建立 Atlas 叢集後再啟用）。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步產物到 MongoDB Atlas
        if: steps.gate.outputs.ready == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'grad_check' }}
        run: |
          ARGS=""
          if [ "${{ inputs.prune }}" = "true" ]; then ARGS="--prune"; fi
          python scripts/sync_to_atlas.py $ARGS
