[project]
name = "grad-pipeline"
version = "0.1.0"
description = "离线数据管线：MinerU/PyMuPDF 解析 PDF + LLM 结构化抽取毕业要求"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "httpx>=0.27",
    "openai>=1.55",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# MinerU 本地 CPU 回退模式需要独立 Python 3.10 环境：
#   conda create -n mineru python=3.10
#   pip install "mineru[cpu]"
# 详见 parsers/mineru_local.py 模块注释
mineru-local = []

[tool.pytest.ini_options]
testpaths = ["tests"]
